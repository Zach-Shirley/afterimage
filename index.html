<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1418" />
    <meta name="description" content="Afterimage: a cozy change-blindness game. Study the room, blink, and find what changed." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Afterimage</title>
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="brand">After<span>image</span></div>
        <div class="stats" aria-live="polite">
          <span id="lives" class="lives" aria-label="lives"></span>
          <span class="stat"><small>Round</small><b id="round">–</b></span>
          <span class="stat"><small>Score</small><b id="score">0</b></span>
          <span class="stat best"><small>Best</small><b id="best">0</b></span>
        </div>
        <button id="mute" class="icon-btn" aria-label="Mute music and sound" title="Mute (M)"></button>
      </header>

      <main class="stage-wrap">
        <div class="stage" id="stage">
          <svg id="room" viewBox="0 0 1000 800" role="img" aria-label="A cozy living room">
            <g id="bg"></g>
            <g id="items"></g>
            <g id="light"></g>
            <g id="marks"></g>
          </svg>
          <div class="lid top"></div>
          <div class="lid bottom"></div>
          <div id="overlay" class="overlay"></div>
        </div>
      </main>

      <footer class="bar">
        <div class="timer" aria-hidden="true"><div id="timer-fill"></div></div>
        <div class="bar-row">
          <div id="status" class="status" aria-live="polite"></div>
          <button id="peek" class="btn ghost" disabled>Look again <small>½ pts</small></button>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
